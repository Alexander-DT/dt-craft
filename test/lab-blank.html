<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blank host — lab page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../dist/dt-craft.css">
<link rel="stylesheet" href="../dist/dt-lab.css">

<!-- theme, set before first paint -->
<script>
(function(){try{
  var r=document.documentElement,t=localStorage.getItem('dt-theme'),a=localStorage.getItem('dt-accent');
  if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  r.setAttribute('data-theme',t);
  r.setAttribute('data-accent',/^(gold|amber|azure|verdant|crimson|violet)$/.test(a)?a:'gold');
}catch(e){}})();
</script>
</head>
<body>

<!-- What a Webflow lab page carries: nothing of its own, and three scripts
     in this order. Swap dt-lab-media.js for any of the other four pages.
     Deferred scripts run in document order, so the markup exists before
     dt-lab.js looks for its components and before dt-craft.js looks for
     #themeSw. Reverse any two and the theme switch is dead. -->
<script src="../dist/dt-lab-media.js" defer></script>
<script src="../dist/dt-lab.js" defer></script>
<script src="../dist/dt-craft.js" defer></script>
</body>
</html>
